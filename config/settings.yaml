# Disputes and Chargebacks Manager (F2) runtime configuration.
#
# Loaded by `src/disputes_chargebacks_manager/config.py`. Point at a different file with
# DISPUTES_SETTINGS; a path that is named but missing is a boot error, not
# a silent fall-back to built-in defaults.
#
# `${VAR}` and `${VAR:-default}` resolve in THREE states: unset takes the default written here,
# SET-AND-EMPTY REFUSES with ConfiguredEmptyError (an operator who emptied a value expressed an
# intent, and it names nothing, so it neither inherits this default nor quietly resolves to the
# empty string, which for a URL, an allowlist or a path is the permissive branch), and a set
# value wins. Unset the variable to take the default written here; do not blank it. This file holds env var NAMES and non-secret defaults
# only: no secret value is ever committed here.

# Data residency. Selected once and shared by the runtime and Terraform.
region: ${GCP_REGION:-asia-southeast1}

# Tenant partition asserted on outbound reviews when the verified principal carries none.
# (Built as one template expression: a literal "${" immediately before a template opener is
# ambiguous to render, so the whole reference is produced by the expression instead.)
tenant: ${DISPUTES_TENANT:-}

# Local profile stores. ":memory:" is the ephemeral, deterministic default the gate uses; a
# deployment points this at a durable path.
audit_path: ${DISPUTES_AUDIT_PATH:-:memory:}

# The external head anchor for the WORM audit chain (practices check C9). The hash chain cannot
# detect a TRUNCATED TAIL by itself: dropping the newest rows leaves a shorter chain that
# verifies perfectly. Point this at a file on a DIFFERENT volume, under different credentials,
# from audit_path, and every append also writes the chain head there. Empty (the default) means
# no anchor, which is correct for the ephemeral ":memory:" store and wrong for a durable one.
audit_anchor_path: ${DISPUTES_AUDIT_ANCHOR:-}

# The audience the managed (gcp) IAP identity adapter verifies the assertion AGAINST: the
# IAP-protected resource, "/projects/<NUM>/global/backendServices/<ID>" behind an HTTPS load
# balancer. It is per-deployment, so it is configuration and never a literal in the adapter.
# Three states, and UNSET and SET-AND-EMPTY land in the same place on purpose: both resolve to
# empty, and an empty audience REFUSES every caller rather than verifying without one.
# google-auth documents audience=None as "the audience is not verified", which accepts ANY
# Google-signed OIDC token, from any project or any app, and reads its email as a principal.
iap_audience: ${DISPUTES_IAP_AUDIENCE:-}

# Rule R8: where an escalated result is routed for human review. The managed profile REFUSES to
# swallow an escalation when this is empty, so a producer cannot ship with R8 unwired.
# The outbound S2S credentials are HUMAN_REVIEW_S2S_TOKEN / HUMAN_REVIEW_S2S_SIGNING_KEY (see .env.secrets.example),
# deliberately distinct from this service's own inbound DISPUTES_S2S_TOKEN.
review_url: ${HUMAN_REVIEW_URL:-}

# The human-review-console case-spine endpoint the managed case-engine adapter opens cases on. Empty (the default)
# means the managed adapter REFUSES: a dispute must not be opened with no case behind it.
case_url: ${CASE_URL:-}

# The complaints-review A2A endpoint the managed regulator-response adapter delegates to (complaints-review stays its own
# repo). Empty (the default) means the managed adapter REFUSES: a regulatory-track dispute must
# reach the regulator-response module rather than silently skipping it.
doc6_url: ${DOC6_A2A_URL:-}

# The per-port adapter map: the ONLY place a binding lives, so switching the whole stack is a
# configuration change rather than a code edit. Every port must bind every profile; the loader
# refuses a partial block and `tests/test_settings_file.py` fails the build if this drifts from
# `config.DEFAULT_BINDINGS`.
project_id: ${GOOGLE_CLOUD_PROJECT:-}

adapters:
  audit:
    local: disputes_chargebacks_manager.adapters.local.audit:LocalAuditAdapter
    gcp: disputes_chargebacks_manager.adapters.gcp.audit:CloudAuditAdapter
    onprem: disputes_chargebacks_manager.adapters.onprem.audit:OnPremAuditAdapter
  identity:
    local: disputes_chargebacks_manager.adapters.local.identity:LocalIdentityAdapter
    gcp: disputes_chargebacks_manager.adapters.gcp.identity:IapIdentityAdapter
    onprem: disputes_chargebacks_manager.adapters.onprem.identity:OnPremIdentityAdapter
  review_router:
    local: disputes_chargebacks_manager.adapters.local.review_router:LocalReviewRouter
    gcp: disputes_chargebacks_manager.adapters.gcp.review_router:CloudReviewRouter
    onprem: disputes_chargebacks_manager.adapters.onprem.review_router:OnPremReviewRouter

  # Tracing. Which BACKEND a deployed profile exports to is not a binding: the gcp
  # adapter reads OTEL_EXPORTER_OTLP_ENDPOINT and sends OTLP to the agent-observability collector when it
  # is set, straight to Cloud Trace when it is not. Tracing is not essential to
  # correctness, so onprem is ABSENT rather than fatal, unlike the other placeholders.
  tracer:
    local: disputes_chargebacks_manager.adapters.local.tracer:LocalNoopTracerAdapter
    gcp: disputes_chargebacks_manager.adapters.gcp.tracer:CloudTracerAdapter
    onprem: disputes_chargebacks_manager.adapters.onprem.tracer:OnPremTracerAdapter

  # The promotion authority (model-quality-gate). The local adapter scores offline but REFUSES to
  # promote: a promotion certified by a laptop with no quality service is certified by
  # nothing.
  evaluation:
    local: disputes_chargebacks_manager.adapters.local.evaluation:LocalOfflineEvalAdapter
    gcp: disputes_chargebacks_manager.adapters.gcp.evaluation:ManagedEvalGateAdapter
    onprem: disputes_chargebacks_manager.adapters.onprem.evaluation:OnPremEvalAdapter
  case_engine:
    local: disputes_chargebacks_manager.adapters.local.case_engine:LocalCaseEngine
    gcp: disputes_chargebacks_manager.adapters.gcp.case_engine:CloudCaseEngine
    onprem: disputes_chargebacks_manager.adapters.onprem.case_engine:OnPremCaseEngine
  document_extraction:
    local: disputes_chargebacks_manager.adapters.local.document_extraction:LocalDocumentExtractor
    gcp: disputes_chargebacks_manager.adapters.gcp.document_extraction:CloudDocumentExtractor
    onprem: disputes_chargebacks_manager.adapters.onprem.document_extraction:OnPremDocumentExtractor
  conversation_channel:
    local: disputes_chargebacks_manager.adapters.local.conversation_channel:LocalConversationChannel
    gcp: disputes_chargebacks_manager.adapters.gcp.conversation_channel:CloudConversationChannel
    onprem: disputes_chargebacks_manager.adapters.onprem.conversation_channel:OnPremConversationChannel
  regulator_response:
    local: disputes_chargebacks_manager.adapters.local.regulator_response:LocalRegulatorResponder
    gcp: disputes_chargebacks_manager.adapters.gcp.regulator_response:CloudRegulatorResponder
    onprem: disputes_chargebacks_manager.adapters.onprem.regulator_response:OnPremRegulatorResponder
  narration:
    local: disputes_chargebacks_manager.adapters.local.narration:LocalNarrator
    gcp: disputes_chargebacks_manager.adapters.gcp.narration:CloudNarrator
    onprem: disputes_chargebacks_manager.adapters.onprem.narration:OnPremNarrator
